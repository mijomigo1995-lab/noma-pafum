<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نوما بارفوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a0a;
    --charcoal:#151412;
    --gold:#c9a24b;
    --gold-bright:#e6c878;
    --ivory:#efe9dc;
    --sapphire:#2b4c8c;
    --ruby:#8c2b3a;
    --line: rgba(201,162,75,0.25);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--black);
    color:var(--ivory);
    font-family:'Tajawal',sans-serif;
    font-weight:300;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Amiri',serif;
    font-weight:400;
    letter-spacing:0.02em;
  }
  .eyebrow{
    font-family:'Tajawal',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.35em;
    font-size:0.7rem;
    color:var(--gold);
  }
  a{color:inherit;text-decoration:none;}

  /* NAV */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;justify-content:space-between;align-items:center;
    padding:22px 6vw;
    background:linear-gradient(to bottom, rgba(10,10,10,0.95), transparent);
  }
  .logo-mark{font-family:'Amiri',serif;font-size:1.3rem;letter-spacing:0.15em;color:var(--gold-bright);}
  .logo-mark img{height:42px;width:auto;display:block;}
  footer .logo-mark img{height:56px;margin:0 auto;}
  .nav-links{display:flex;gap:36px;font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase;}
  .nav-links a{opacity:0.85;transition:opacity .3s;}
  .nav-links a:hover{opacity:1;color:var(--gold-bright);}
  .nav-cta{border:1px solid var(--gold);padding:9px 20px;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;}

  /* HERO */
  .hero{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    position:relative;
    padding:120px 6vw 60px;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(201,162,75,0.10), transparent 60%),
      var(--black);
  }
  .hero .eyebrow{margin-bottom:22px;opacity:0;animation:fadeUp 1s ease forwards 0.2s;}
  .hero h1{
    font-size:clamp(3.2rem, 9vw, 7rem);
    line-height:0.95;
    color:var(--ivory);
    opacity:0;animation:fadeUp 1.1s ease forwards 0.4s;
  }
  .hero h1 span{color:var(--gold-bright);font-style:italic;}
  .hero .sub{
    margin-top:26px;max-width:480px;font-size:1.02rem;line-height:1.7;color:rgba(239,233,220,0.7);
    opacity:0;animation:fadeUp 1.1s ease forwards 0.6s;
  }
  .divider{
    display:flex;align-items:center;gap:14px;margin:34px 0;
    opacity:0;animation:fadeUp 1.1s ease forwards 0.8s;
  }
  .divider .line{width:50px;height:1px;background:var(--line);}
  .divider .diamond{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);}
  .hero-cta{
    opacity:0;animation:fadeUp 1.1s ease forwards 1s;
    border:1px solid var(--gold);
    padding:16px 42px;
    font-size:0.8rem;letter-spacing:0.15em;text-transform:uppercase;
    transition:background .35s, color .35s;
  }
  .hero-cta:hover{background:var(--gold);color:var(--black);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

  /* SECTION SHELL */
  section{padding:110px 6vw;}
  .section-head{text-align:center;max-width:640px;margin:0 auto 64px;}
  .section-head h2{font-size:clamp(2.2rem,4vw,3.2rem);margin-top:14px;}
  .section-head p{margin-top:16px;color:rgba(239,233,220,0.65);font-size:0.98rem;line-height:1.7;}

  /* COLLECTION GRID */
  .collections{display:flex;flex-direction:column;gap:2px;}
  .collection-row{
    display:flex;
    gap:2px;background:var(--line);
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding-bottom:4px;
    scrollbar-width:thin;
    scrollbar-color:var(--gold) transparent;
  }
  .collection-row::-webkit-scrollbar{height:5px;}
  .collection-row::-webkit-scrollbar-thumb{background:var(--gold);}
  .collection-row::-webkit-scrollbar-track{background:transparent;}
  .card{
    background:var(--charcoal);
    padding:44px 26px 34px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    position:relative;
    transition:background .4s;
    flex:0 0 220px;
    scroll-snap-align:start;
  }
  .card:hover{background:#1b1916;}
  .bottle-img{
    width:90px;height:auto;margin-bottom:22px;
    filter:drop-shadow(0 20px 30px rgba(0,0,0,0.65));
    transition:transform .4s;
  }
  .card:hover .bottle-img{transform:translateY(-6px);}
  .card .fam{font-size:0.68rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .card .inspired{font-size:0.68rem;font-style:italic;color:rgba(239,233,220,0.5);margin-bottom:2px;}
  .card h3{font-size:1.15rem;line-height:1.3;color:var(--ivory);}
  .card .note{font-size:0.85rem;color:rgba(239,233,220,0.55);margin-top:8px;min-height:38px;}
  .card .price{margin-top:18px;font-family:'Tajawal';font-size:1rem;color:var(--gold-bright);letter-spacing:0.05em;}
  .card .buy{
    margin-top:20px;font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;
    border-bottom:1px solid var(--gold);padding-bottom:4px;
    opacity:0.85;
  }
  .card .buy:hover{opacity:1;}

  /* PACKS */
  .packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;max-width:900px;margin:0 auto;}
  .pack-card{
    border:1px solid var(--line);padding:46px 36px;text-align:center;position:relative;
  }
  .pack-card .eyebrow{margin-bottom:14px;}
  .pack-card h3{font-size:2rem;margin-bottom:10px;}
  .pack-card .save{
    position:absolute;top:-1px;right:-1px;background:var(--gold);color:var(--black);
    font-size:0.65rem;letter-spacing:0.1em;padding:6px 14px;text-transform:uppercase;
  }
  .pack-card .price-row{margin:22px 0;}
  .pack-card .old{text-decoration:line-through;opacity:0.4;font-size:0.9rem;margin-right:10px;}
  .pack-card .new{color:var(--gold-bright);font-size:1.6rem;font-family:'Amiri';}
  .pack-card .buy-btn{
    display:inline-block;margin-top:18px;border:1px solid var(--gold);padding:13px 34px;
    font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;transition:.35s;
  }
  .pack-card .buy-btn:hover{background:var(--gold);color:var(--black);}

  /* COD BANNER */
  .cod-banner{
    background:var(--charcoal);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    display:flex;flex-wrap:wrap;justify-content:center;gap:60px;padding:56px 6vw;text-align:center;
  }
  .cod-item .num{font-family:'Amiri';font-size:2.4rem;color:var(--gold-bright);}
  .cod-item .lbl{font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(239,233,220,0.6);margin-top:6px;}

  /* ORDER FORM */
  .order-wrap{max-width:560px;margin:0 auto;}
  .order-form{display:flex;flex-direction:column;gap:18px;}
  .field label{display:block;font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
  .field input, .field select{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
    color:var(--ivory);padding:12px 2px;font-family:'Tajawal';font-size:0.95rem;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--gold);}
  .field select option{background:var(--charcoal);}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .submit-btn{
    margin-top:14px;background:var(--gold);color:var(--black);border:none;
    padding:17px;font-size:0.8rem;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;
    transition:background .3s;
  }
  .submit-btn:hover{background:var(--gold-bright);}
  .cod-note{margin-top:18px;font-size:0.8rem;text-align:center;color:rgba(239,233,220,0.55);}

  footer{
    text-align:center;padding:50px 6vw 40px;border-top:1px solid var(--line);
    font-size:0.75rem;color:rgba(239,233,220,0.45);letter-spacing:0.05em;
  }
  footer .logo-mark{display:block;margin-bottom:14px;font-size:1.1rem;}

  @media (max-width:640px){
    .nav-links{display:none;}
    section{padding:80px 6vw;}
    .row-2{grid-template-columns:1fr;}
  }
</style>
</head>
